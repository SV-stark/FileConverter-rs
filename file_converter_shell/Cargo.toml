[package]
name = "file_converter_shell"
version = "0.9.6"
edition = "2024"
description = "Windows Explorer context menu shell extension for FileConverter-rs"
license = "GPL-3.0-or-later"
repository = "https://github.com/SV-stark/FileConverter-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
file_converter_core.workspace = true
scopeguard.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
windows-core.workspace = true
windows.workspace = true
